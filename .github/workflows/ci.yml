name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flake-check:
    name: Validate flake outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check flake
        run: nix flake check --show-trace

      - name: Verify exported helpers
        run: |
          nix eval --json .#lib --apply builtins.attrNames | jq --exit-status '
            sort == [
              "all",
              "bash",
              "bashHistoryShellHook",
              "fish",
              "fishHistoryShellHook",
              "projectShellHistoryHook",
              "zsh",
              "zshHistoryShellHook"
            ]
          '
